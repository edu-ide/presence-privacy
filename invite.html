<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence — 초대</title>
<style>
  :root {
    --bg: #ffffff; --fg: #0f1419; --sub: #536471; --line: #eff3f4;
    --green: #00ba7c; --card: #f7f9f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #e7e9ea; --sub: #71767b; --line: #2f3336; --card: #16181c; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo",
      "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.65; padding: 0 20px 80px;
  }
  main { max-width: 480px; margin: 0 auto; text-align: center; padding-top: 80px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.3px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green);
         box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 18%, transparent); }
  p.lead { margin-top: 22px; font-size: 16px; }
  p.sub { color: var(--sub); font-size: 13px; margin-top: 10px; }
  .uri { margin-top: 18px; padding: 12px; background: var(--card); border-radius: 12px;
         font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all;
         border: 1px solid var(--line); }
  a.open {
    display: inline-block; margin-top: 26px; padding: 14px 34px; border-radius: 999px;
    background: var(--green); color: #fff; font-weight: 800; font-size: 16px;
    text-decoration: none;
  }
  .note { margin-top: 34px; color: var(--sub); font-size: 13px; text-align: left;
          border-top: 1px solid var(--line); padding-top: 18px; }
  .note b { color: var(--fg); }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span><h1>Presence</h1></div>
  <p class="lead">지금 존재하는 사람의 초대장입니다.</p>
  <p class="sub">이 링크의 주인이 <b>켜져 있는 동안만</b> 만날 수 있습니다 — 그게 Presence입니다.</p>
  <div class="uri" id="uri">초대 주소가 없습니다</div>
  <a class="open" id="open" href="#" hidden>지금 만나러 가기</a>
  <div class="note">
    <p><b>앱이 없다면:</b> Presence는 서버 없이 기기끼리 직접 만나는 존재 기반 SNS입니다.
    Google Play에서 <b>Presence</b>(app.pnp.presence)를 설치한 뒤 이 링크를 다시 열어 주세요.</p>
    <p style="margin-top:10px">초대 주소는 주소창의 <code>#</code> 뒤에만 있어 이 페이지 서버에도 전송되지 않습니다.</p>
  </div>
</main>
<script>
  // 초대 URI는 해시 프래그먼트로만 전달된다 — 서버 로그에 남지 않는다 (망각 원칙)
  var raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (/^pnp:[a-z2-7]+$/.test(raw)) {
    document.getElementById("uri").textContent = raw;
    var a = document.getElementById("open");
    a.href = raw;
    a.hidden = false;
  }
</script>
</body>
</html>
